<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#080B12"/>
<title>Prontuário · Suíte Clínica Vitality — Ecossistema Dr. Tenner Nunes</title>
<meta name="description" content="Módulo Prontuário do ecossistema Morpheus — prontuário eletrônico e pacote pós-consulta em modo LGPD Zero-Knowledge."/>

<!-- ============================================================
     MORPHEUS · MÓDULO PRONTUÁRIO
     Suíte clínica Vitality / método Renova Corps®.
     Prontuário eletrônico (Cadastro > Anamnese > Evolução >
     Prescrições > Exames > Linha do tempo) + gerador do pacote
     pós-consulta (9 DOCX + 1 PPTX) a partir dos dados da consulta.
     Modo LGPD Zero-Knowledge: tudo roda no navegador (localStorage);
     nada é enviado. Dados de exemplo são SINTÉTICOS.
     Mesmo design system (Azul & Dourado). Acento: Dourado Claro.
     Front puro. Documento Word-openable gerado sem biblioteca.
     ============================================================ -->
<style>
:root{
  --preto:#080B12;--azul-marinho:#0D1F3F;--azul-realce:#2B5AA0;
  --dourado:#C8A24A;--dourado-claro:#E6CD8C;--off-white:#F4F2EA;
  --bg-0:#060910;--bg-1:#0A1526;--bg-2:#0D1F3F;
  --linha:rgba(200,162,74,.18);--linha-forte:rgba(200,162,74,.34);
  --vidro-forte:rgba(10,21,38,.9);
  --texto:#F4F2EA;--texto-suave:rgba(244,242,234,.64);--texto-fraco:rgba(244,242,234,.40);
  --ok:#5FBF8F;--warn:#D9B45A;--err:#D98A7A;
  --acc:#E6CD8C;--acc-2:#C8A24A;--acc-soft:rgba(230,205,140,.13);--acc-line:rgba(230,205,140,.4);--acc-glow:rgba(230,205,140,.22);
  --serif:Georgia,'Times New Roman',Times,serif;--sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --r-sm:9px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --sombra:0 24px 60px -22px rgba(0,0,0,.75);--ease:cubic-bezier(.22,.61,.36,1);--max:1240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--preto);color:var(--texto);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,.serif{font-family:var(--serif);font-weight:400;letter-spacing:.2px}
::selection{background:var(--dourado);color:var(--preto)}
.eyebrow{font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dourado);font-weight:600}
.muted{color:var(--texto-suave)}.gold{color:var(--dourado)}
#bg3d{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,9,16,.6),rgba(6,9,16,.9))}

/* APP SHELL */
.app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--linha);background:rgba(6,9,16,.72);backdrop-filter:blur(14px);position:sticky;top:0;z-index:40}
.back{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--texto-suave);padding:8px 12px;border-radius:999px;border:1px solid var(--linha);transition:.25s}
.back:hover{color:var(--off-white);border-color:var(--linha-forte);background:rgba(230,205,140,.07)}
.brand{display:flex;align-items:center;gap:11px}
.brand img{width:30px;height:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.brand .bt{display:flex;flex-direction:column;line-height:1.05}
.brand .bt b{font-family:var(--serif);font-size:15px}
.brand .bt span{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dourado)}
.lgpd{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ok);border:1px solid rgba(95,191,143,.3);background:rgba(95,191,143,.08);padding:7px 13px;border-radius:999px}
.lgpd svg{width:15px;height:15px}
.lgpd b{color:var(--off-white);font-weight:600}

.layout{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
/* SIDEBAR pacientes */
.side{border-right:1px solid var(--linha);background:rgba(10,21,38,.5);display:flex;flex-direction:column;max-height:calc(100vh - 58px);position:sticky;top:58px}
.side-h{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.side-h .eyebrow{margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.25s var(--ease);font-family:var(--sans)}
.btn-gold{background:linear-gradient(180deg,var(--dourado-claro),var(--dourado));color:#2a2008;box-shadow:0 12px 30px -14px rgba(200,162,74,.6)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-ghost{border-color:var(--linha-forte);color:var(--off-white);background:rgba(13,31,63,.4)}
.btn-ghost:hover{background:rgba(230,205,140,.1)}
.mini{padding:7px 12px;font-size:12px}
.search{margin:0 16px 10px;display:flex;align-items:center;gap:9px;background:var(--bg-0);border:1px solid var(--linha);border-radius:10px;padding:9px 12px}
.search svg{width:15px;height:15px;color:var(--texto-fraco)}
.search input{flex:1;background:transparent;border:none;outline:none;color:var(--off-white);font-size:13.5px;font-family:var(--sans)}
.plist{flex:1;overflow-y:auto;padding:4px 12px 20px}
.pcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;cursor:pointer;transition:.2s;border:1px solid transparent}
.pcard:hover{background:rgba(230,205,140,.06)}
.pcard.on{background:rgba(230,205,140,.1);border-color:var(--linha)}
.pav{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--serif);font-size:15px;color:var(--preto);font-weight:700}
.pcard .pi{min-width:0;flex:1}
.pcard .pi b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pi span{font-size:11.5px;color:var(--texto-fraco)}
.pcard .alert{width:8px;height:8px;border-radius:50%;background:var(--err);flex:0 0 auto;box-shadow:0 0 8px var(--err)}

/* MAIN */
.main{overflow-y:auto;max-height:calc(100vh - 58px);padding:26px 30px 60px}
.empty{height:60vh;display:grid;place-items:center;text-align:center;color:var(--texto-fraco)}
.empty svg{width:50px;height:50px;color:var(--linha-forte);margin-bottom:16px}
.phead{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--linha);margin-bottom:22px}
.phead .pav{width:64px;height:64px;font-size:22px;border-radius:16px}
.phead .who h2{font-size:26px;line-height:1.1}
.phead .who .sub{font-size:13.5px;color:var(--texto-suave);margin-top:4px;display:flex;flex-wrap:wrap;gap:14px}
.phead .who .sub b{color:var(--dourado);font-family:var(--serif)}
.phead .hactions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.vitals{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.vital{border:1px solid var(--linha);border-radius:12px;padding:11px 16px;background:var(--bg-1);min-width:92px}
.vital b{font-family:var(--serif);font-size:20px;color:var(--dourado);display:block;line-height:1.1}
.vital span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-fraco)}
.vital.warn b{color:var(--warn)}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--linha);margin-bottom:24px}
.tab{padding:11px 15px;font-size:13px;color:var(--texto-suave);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.tab.on{color:var(--dourado);border-color:var(--dourado)}
.panel{display:none}.panel.on{display:block;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{border:1px solid var(--linha);border-radius:var(--r-lg);background:linear-gradient(180deg,var(--bg-1),var(--bg-0));padding:22px;margin-bottom:16px}
.card h3{font-size:18px;margin-bottom:4px}
.card .lead{font-size:13px;color:var(--texto-suave);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{margin-bottom:14px}
.fld label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-suave);display:block;margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--bg-0);border:1px solid var(--linha);border-radius:10px;padding:11px 13px;color:var(--off-white);font-family:var(--sans);font-size:14px;outline:none;transition:.2s;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--dourado)}
.fld textarea{min-height:80px;line-height:1.6}
.chks{display:flex;flex-wrap:wrap;gap:8px}
.chk-pill{font-size:12.5px;padding:8px 13px;border-radius:999px;border:1px solid var(--linha);background:var(--bg-0);color:var(--texto-suave);cursor:pointer;transition:.2s;user-select:none}
.chk-pill.on{background:var(--acc-soft);border-color:var(--acc-line);color:var(--dourado-claro)}

/* Timeline */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--linha)}
.tl-item{position:relative;margin-bottom:18px}
.tl-item::before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bg-0);box-shadow:0 0 8px var(--acc-glow)}
.tl-item .tl-d{font-size:11.5px;color:var(--dourado);letter-spacing:.05em}
.tl-item .tl-c{border:1px solid var(--linha);border-radius:12px;padding:14px 16px;background:var(--bg-1);margin-top:6px}
.tl-item .tl-c .kind{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--texto-fraco)}
.tl-item .tl-c h4{font-family:var(--sans);font-size:14.5px;font-weight:600;margin:2px 0 4px}
.tl-item .tl-c p{font-size:13.5px;color:var(--texto-suave)}

/* listas simples (prescrições/exames) */
.rowlist{display:flex;flex-direction:column;gap:8px}
.rowitem{display:flex;gap:12px;align-items:center;border:1px solid var(--linha);border-radius:10px;padding:12px 14px;background:var(--bg-1)}
.rowitem .ri{flex:1}
.rowitem .ri b{font-size:14px;display:block}
.rowitem .ri span{font-size:12px;color:var(--texto-fraco)}
.status-tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--linha)}
.status-tag.pend{color:var(--warn);border-color:rgba(217,180,90,.4)}
.status-tag.done{color:var(--ok);border-color:rgba(95,191,143,.4)}

/* Pacote de documentos */
.docgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.docitem{display:flex;gap:13px;align-items:center;border:1px solid var(--linha);border-radius:12px;padding:14px 16px;background:var(--bg-1);transition:.2s}
.docitem:hover{border-color:var(--linha-forte)}
.docitem .di{width:40px;height:40px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;background:var(--acc-soft);border:1px solid var(--acc-line);color:var(--dourado-claro);font-size:10px;font-weight:700;letter-spacing:.05em}
.docitem .dc{flex:1;min-width:0}
.docitem .dc b{font-size:13.5px;display:block}
.docitem .dc span{font-size:11.5px;color:var(--texto-fraco)}
.docitem .act{color:var(--dourado);cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding:34px 18px;background:rgba(4,7,13,.78);backdrop-filter:blur(8px);overflow-y:auto}
.overlay.open{display:flex}
.sheet{width:100%;max-width:760px;background:linear-gradient(180deg,var(--bg-2),var(--bg-0));border:1px solid var(--linha-forte);border-radius:var(--r-xl);box-shadow:var(--sombra);overflow:hidden;animation:pop .45s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.sheet-h{padding:22px 26px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:12px}
.sheet-h .eyebrow{margin:0}.sheet-h h3{font-size:20px;margin-top:2px}
.sheet-b{padding:22px 26px}
.sheet-f{padding:16px 26px;border-top:1px solid var(--linha);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid var(--linha);background:transparent;color:var(--off-white);cursor:pointer;display:grid;place-items:center;transition:.25s;margin-left:auto}
.icon-btn:hover{border-color:var(--linha-forte)}
.icon-btn svg{width:16px;height:16px}
.note{font-size:12.5px;color:var(--texto-fraco);background:rgba(43,90,160,.12);border:1px solid var(--linha);border-radius:10px;padding:12px 14px;line-height:1.5}

.score-out{display:none;margin-top:12px;padding:12px 16px;border-radius:10px;font-size:14px;border:1px solid var(--linha)}.score-out.show{display:block}.score-out b{font-family:var(--serif);color:var(--dourado)}.score-out.ok{border-color:rgba(95,191,143,.4);background:rgba(95,191,143,.1)}.score-out.warn{border-color:rgba(217,180,90,.4);background:rgba(217,180,90,.1)}.score-out.err{border-color:rgba(217,138,122,.4);background:rgba(217,138,122,.1)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);z-index:130;background:var(--vidro-forte);border:1px solid var(--linha-forte);border-radius:999px;padding:12px 22px;font-size:13px;opacity:0;transition:.4s var(--ease);pointer-events:none;backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.conecta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.conecta a{display:flex;gap:12px;align-items:center;border:1px solid var(--linha);border-radius:12px;padding:14px 16px;transition:.25s;cursor:pointer;background:rgba(13,31,63,.35)}
.conecta a:hover{border-color:var(--linha-forte)}
.conecta .ci{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.conecta .ci svg{width:19px;height:19px}
.conecta b{font-size:14px}.conecta p{font-size:12px;color:var(--texto-suave)}

@media(max-width:920px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--linha)}
  .plist{max-height:220px}
  .main{max-height:none}
  .grid2,.docgrid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.2s!important}}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function idade(nasc){if(!nasc)return'—';const d=new Date(nasc),n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a;}
function imc(alt,peso){if(!alt||!peso)return null;const m=alt/100;return +(peso/(m*m)).toFixed(1);}

const Ficha={

        </div>
      </div>
      <div class="vitals">
        <div class="vital"><b>${p.altura||'—'}</b><span>Altura (cm)</span></div>
        <div class="vital"><b>${p.peso||'—'}</b><span>Peso (kg)</span></div>
        <div class="vital ${cls}"><b>${val}</b><span>IMC · ${lbl}</span></div>
        <div class="vital"><b>${p.evolucoes.length}</b><span>Atendimentos</span></div>
        <div class="vital"><b>${p.exames_ped.filter(e=>e.st==='pend').length}</b><span>Exames pend.</span></div>
      </div>
      <div class="tabs">${TABS.map(([id,l])=>`<div class="tab ${id===TAB?'on':''}" onclick="Ficha.tab('${id}')">${l}</div>`).join('')}</div>
      <div id="panelHost"></div>`;
    this.renderPanel();
  },
  tab(id){TAB=id;this.render();},
  renderPanel(){
    const p=ATIVO;const h=$('#panelHost');
    if(TAB==='resumo')h.innerHTML=this.pResumo(p);
    else if(TAB==='cadastro')h.innerHTML=this.pCadastro(p);
    else if(TAB==='anamnese')h.innerHTML=this.pAnamnese(p);
    else if(TAB==='evolucao')h.innerHTML=this.pEvolucao(p);
    else if(TAB==='prescricoes')h.innerHTML=this.pRow(p,'prescricoes','Prescrições','medicamento + posologia');
    else if(TAB==='exames')h.innerHTML=this.pRow(p,'exames_ped','Pedidos de exame','exame solicitado');
    else if(TAB==='escores')h.innerHTML=Escores.panel(p);
    else if(TAB==='documentos')h.innerHTML=this.pDocs(p);
    this.bind();
  },
  /* --- RESUMO / TIMELINE --- */
  pResumo(p){
    const linhas=[];
    p.evolucoes.forEach(e=>linhas.push({d:e.d,kind:e.kind,h:e.t,p:e.p}));
    p.prescricoes.forEach(x=>linhas.push({d:'',kind:'Prescrição',h:x.n,p:x.pos}));
    p.exames_ped.forEach(x=>linhas.push({d:'',kind:'Exame',h:x.n,p:x.st==='done'?'Realizado':'Pendente'}));
    linhas.sort((a,b)=>(b.d||'').localeCompare(a.d||''));
    return `<div class="card"><h3>Panorama</h3><p class="lead">Queixa e conduta atual do paciente.</p>
      <div class="grid2">
        <div class="fld"><label>Queixa principal</label><div class="note">${esc(p.queixa)||'—'}</div></div>
        <div class="fld"><label>Conduta / plano</label><div class="note">${esc(p.conduta)||'—'}</div></div>
      </div></div>
      <div class="card"><h3>Linha do tempo</h3><p class="lead">Histórico cronológico do paciente.</p>
      <div class="timeline">${linhas.map(l=>`<div class="tl-item"><div class="tl-d">${l.d?fmtData(l.d):'—'}</div>
        <div class="tl-c"><div class="kind">${esc(l.kind)}</div><h4>${esc(l.h)}</h4><p>${esc(l.p)}</p></div></div>`).join('')||'<p class="muted">Sem registros ainda.</p>'}</div></div>
      <div class="card"><h3>No ecossistema</h3><p class="lead">O Prontuário conversa com os outros módulos.</p>
        <div class="conecta">
          <a onclick="App.cross('curador')"><div class="ci" style="background:rgba(200,162,74,.14);border:1px solid var(--linha);color:var(--dourado)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/></svg></div>
            <div><b class="gold">Curador</b><p>Dúvida frequente deste paciente vira pauta de conteúdo.</p></div></a>
          <a onclick="App.cross('educador')"><div class="ci" style="background:rgba(43,90,160,.14);border:1px solid var(--linha);color:var(--azul-realce)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 10 12 5 2 10l10 5 10-5Z"/></svg></div>
            <div><b style="color:var(--azul-realce)">Educador</b><p>Prescreva uma trilha educativa como orientação.</p></div></a>
        </div></div>`;
  },
  /* --- CADASTRO --- */
  pCadastro(p){

        <div class="fld"><label>Nome completo</label><input data-k="nome" value="${esc(p.nome)}"/></div>
        <div class="fld"><label>Profissão</label><input data-k="profissao" value="${esc(p.profissao)}"/></div>
        <div class="fld"><label>Data de nascimento</label><input type="date" data-k="nasc" value="${esc(p.nasc)}"/></div>
        <div class="fld"><label>Sexo</label><select data-k="sexo"><option value="F" ${p.sexo==='F'?'selected':''}>Feminino</option><option value="M" ${p.sexo==='M'?'selected':''}>Masculino</option></select></div>
        <div class="fld"><label>Altura (cm)</label><input type="number" data-k="altura" data-num="1" value="${p.altura||''}"/></div>
        <div class="fld"><label>Peso (kg)</label><input type="number" data-k="peso" data-num="1" value="${p.peso||''}"/></div>
        <div class="fld"><label>Telefone</label><input data-k="tel" value="${esc(p.tel)}"/></div>
        <div class="fld"><label>CID-10 principal</label><select data-k="cid"><option value="">—</option>${CID.map(c=>`<option value="${c.c}" ${p.cid===c.c?'selected':''}>${c.c} · ${c.d}</option>`).join('')}</select></div>
      </div>
      <label style="display:flex;gap:9px;align-items:center;font-size:13.5px;color:var(--texto-suave);cursor:pointer;margin-top:6px">

    </div>`;
  },
  /* --- ANAMNESE --- */
  pAnamnese(p){
    return `<div class="card"><h3>Anamnese</h3><p class="lead">Primeira consulta — queixa, história e antecedentes.</p>
      <div class="fld"><label>Queixa principal</label><textarea data-k="queixa">${esc(p.queixa)}</textarea></div>
      <div class="fld"><label>História da doença atual</label><textarea data-k="hda">${esc(p.hda)}</textarea></div>
      <div class="grid2">
        <div class="fld"><label>Medicamentos em uso</label><textarea data-k="medicamentos">${esc(p.medicamentos)}</textarea></div>
        <div class="fld"><label>História social</label><textarea data-k="social">${esc(p.social)}</textarea></div>
      </div>
      <div class="fld"><label>Exame físico</label><textarea data-k="exame">${esc(p.exame)}</textarea></div>
      <div class="fld"><label>Antecedentes pessoais</label><div class="chks" id="antP">${ANT_PESSOAIS.map(a=>`<span class="chk-pill ${p.antP.includes(a)?'on':''}" data-grp="antP" data-v="${a}">${a}</span>`).join('')}</div></div>
      <div class="fld"><label>Antecedentes familiares</label><div class="chks" id="antF">${ANT_FAMILIARES.map(a=>`<span class="chk-pill ${p.antF.includes(a)?'on':''}" data-grp="antF" data-v="${a}">${a}</span>`).join('')}</div></div>
      <div class="fld"><label>Conduta / plano terapêutico</label><textarea data-k="conduta">${esc(p.conduta)}</textarea></div>
    </div>`;
  },
  /* --- EVOLUÇÃO --- */
  pEvolucao(p){
    return `<div class="card"><h3>Evolução</h3><p class="lead">Notas por atendimento, com data e tipo.</p>
      <button class="btn btn-gold mini" style="margin-bottom:16px" onclick="Consulta.nova()">+ Registrar consulta / retorno</button>
      <div class="rowlist">${p.evolucoes.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(e=>`
        <div class="rowitem"><div class="ri"><b>${esc(e.t)}</b><span>${fmtData(e.d)} · ${esc(e.kind)}</span>
          <p style="font-size:13px;color:var(--texto-suave);margin-top:6px">${esc(e.p)}</p></div></div>`).join('')||'<p class="muted">Nenhuma evolução registrada.</p>'}</div>
    </div>`;
  },
  /* --- PRESCRIÇÕES / EXAMES (listas) --- */
  pRow(p,campo,titulo,ph){
    const isExame=campo==='exames_ped';
    return `<div class="card"><h3>${titulo}</h3>
      <div style="display:flex;gap:10px;margin:6px 0 16px;flex-wrap:wrap">
        <input id="rowIn" class="fld" style="flex:1;min-width:200px;background:var(--bg-0);border:1px solid var(--linha);border-radius:10px;padding:11px 13px;color:var(--off-white);font-size:14px" placeholder="Adicionar ${ph}…"/>
        ${isExame?'':'<input id="rowIn2" style="flex:1;min-width:160px;background:var(--bg-0);border:1px solid var(--linha);border-radius:10px;padding:11px 13px;color:var(--off-white);font-size:14px" placeholder="posologia"/>'}
        <button class="btn btn-gold mini" onclick="Ficha.addRow('${campo}')">Adicionar</button>
      </div>
      <div class="rowlist">${p[campo].map((x,i)=>`
        <div class="rowitem"><div class="ri"><b>${esc(x.n)}</b>${x.pos?`<span>${esc(x.pos)}</span>`:''}</div>
          <span class="status-tag ${x.st==='done'?'done':'pend'}" onclick="Ficha.toggleSt('${campo}',${i})" style="cursor:pointer">${x.st==='done'?(isExame?'Realizado':'Ativa'):(isExame?'Pendente':'Suspensa')}</span>
        </div>`).join('')||'<p class="muted">Nada registrado.</p>'}</div>
    </div>`;
  },
  /* --- DOCUMENTOS (pacote pós-consulta) --- */
  pDocs(p){
    return `<div class="card"><h3>Pacote pós-consulta</h3>
      <p class="lead">9 documentos (DOCX) + 1 apresentação (PPTX) gerados a partir dos dados da consulta e do timbrado. O <b>Resumo Executivo</b> já sai pronto em Word/PDF; os demais são o pipeline que se conecta aos seus geradores (PizZip/PptxGenJS).</p>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <button class="btn btn-gold mini" onclick="Docs.gerarResumo()">Gerar Resumo Executivo (.doc)</button>
        <button class="btn btn-ghost mini" onclick="Docs.imprimirResumo()">Visualizar / Imprimir PDF</button>
        <button class="btn btn-ghost mini" onclick="Docs.exportJSON()">Exportar dados (JSON)</button>
      </div>
      <div class="docgrid">${PACOTE.map(d=>`<div class="docitem"><div class="di">${d.t}</div>
        <div class="dc"><b>${esc(d.n)}</b><span>${d.key==='resumo'?'Pronto para gerar':'Pipeline · a conectar'}</span></div>
        <span class="act" onclick="Docs.item('${d.key}')">${d.key==='resumo'?'Gerar':'Prévia'}</span></div>`).join('')}</div>
      <div class="note" style="margin-top:16px"><b style="color:var(--dourado-claro)">Modo Zero-Knowledge:</b> os dados do paciente permanecem apenas neste navegador. Antes de enviar qualquer caso a uma IA externa, use “Anonimizar p/ IA”.</div>
    </div>`;
  },
  /* --- binds --- */
  bind(){
    $$('#panelHost [data-k]').forEach(el=>{
      const ev=el.type==='checkbox'?'change':'input';
      el.addEventListener(ev,()=>{
        let v=el.type==='checkbox'?el.checked:el.value;
        if(el.dataset.num)v=v===''?null:+v;
        ATIVO[el.dataset.k]=v;Store.save(DB);
        if(['nome','nasc','sexo','profissao','cid','altura','peso','alerta'].includes(el.dataset.k)){Pac.render();
          if(['altura','peso','nome','nasc','cid'].includes(el.dataset.k))Ficha.refreshHead();}
      });
    });
    $$('#panelHost .chk-pill').forEach(el=>el.addEventListener('click',()=>{
      const grp=el.dataset.grp,v=el.dataset.v;const arr=ATIVO[grp];
      const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);
      el.classList.toggle('on');Store.save(DB);
    }));
  },
  refreshHead(){ // atualiza header/vitals sem perder foco do textarea
    const p=ATIVO;const iv=imc(p.altura,p.peso);const[val,lbl,cls]=imcClass(iv);
    const vitals=$('#ficha .vitals');if(vitals)vitals.children[2].querySelector('b').textContent=val;
  },
  addRow(campo){
    const n=$('#rowIn').value.trim();if(!n){toast('Escreva o item.');return;}
    const pos=$('#rowIn2')?$('#rowIn2').value.trim():'';
    ATIVO[campo].push({n,pos,st:'pend'});Store.save(DB);this.renderPanel();
  },
  toggleSt(campo,i){const x=ATIVO[campo][i];x.st=x.st==='done'?'pend':'done';Store.save(DB);this.renderPanel();},
  anonimizar(){
    const p=ATIVO;
    const anon=`CASO CLÍNICO (ANONIMIZADO)
Paciente: [INICIAIS ${iniciais(p.nome)}] · ${idade(p.nasc)} anos · ${p.sexo==='F'?'Feminino':'Masculino'}
IMC: ${imc(p.altura,p.peso)||'—'}
Queixa: ${p.queixa}
HDA: ${p.hda}
Antecedentes pessoais: ${p.antP.join(', ')||'—'}
Antecedentes familiares: ${p.antF.join(', ')||'—'}
Medicamentos: ${p.medicamentos||'—'}
Exame físico: ${p.exame||'—'}
Hipótese/CID: ${p.cid||'—'}
Conduta: ${p.conduta||'—'}`;
    UI.sheet('Caso anonimizado (LGPD)',
      `<p class="note" style="margin-bottom:14px">Nome, telefone e dados diretos removidos. Copie para levar a uma IA externa com segurança.</p>
       <textarea style="width:100%;min-height:280px;background:var(--bg-0);border:1px solid var(--linha);border-radius:10px;padding:14px;color:var(--off-white);font-size:13px;font-family:var(--sans);line-height:1.6">${esc(anon)}</textarea>`,
      `<button class="btn btn-ghost" onclick="UI.close()">Fechar</button><button class="btn btn-gold" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.querySelector('#sheet textarea').value);toast('Caso anonimizado copiado.')">Copiar</button>`);
  }
};

/* =========================================================
   DOCS — geração do Resumo Executivo (Word-openable, sem lib)
   ========================================================= */
const Docs={
  resumoHTML(){
    const p=ATIVO;const iv=imc(p.altura,p.peso);const[val,lbl]=imcClass(iv);const hoje=new Date().toLocaleDateString('pt-BR');
    const cid=CID.find(c=>c.c===p.cid);
    return `<div style="font-family:Georgia,serif;color:#0D1F3F;max-width:720px;margin:0 auto">
      <div style="border-bottom:3px solid #C8A24A;padding-bottom:14px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end">
        <div><div style="font-size:22px;font-weight:bold">Dr. Tenner Nunes</div>
          <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#C8A24A">Medicina do Estilo de Vida · Instituto Vitality</div></div>
        <div style="text-align:right;font-size:11px;color:#555">CRM/RR 2920<br>${hoje}</div>
      </div>
      <h2 style="font-size:18px;color:#0D1F3F;margin-bottom:16px">Resumo Executivo da Consulta</h2>
      <table style="width:100%;font-family:Arial,sans-serif;font-size:13px;border-collapse:collapse;margin-bottom:18px">
        <tr><td style="padding:6px 0;width:180px;color:#777">Paciente</td><td style="font-weight:bold">${esc(p.nome)}</td></tr>
        <tr><td style="padding:6px 0;color:#777">Idade / sexo</td><td>${idade(p.nasc)} anos · ${p.sexo==='F'?'Feminino':'Masculino'}</td></tr>
        <tr><td style="padding:6px 0;color:#777">Altura / peso / IMC</td><td>${p.altura||'—'} cm · ${p.peso||'—'} kg · IMC ${val} (${lbl})</td></tr>
        <tr><td style="padding:6px 0;color:#777">Hipótese / CID-10</td><td>${cid?cid.c+' · '+cid.d:(p.cid||'—')}</td></tr>
      </table>
      ${this.secao('Queixa principal',p.queixa)}
      ${this.secao('História da doença atual',p.hda)}
      ${this.secao('Antecedentes',[p.antP.length?'Pessoais: '+p.antP.join(', '):'',p.antF.length?'Familiares: '+p.antF.join(', '):''].filter(Boolean).join(' · '))}
      ${this.secao('Medicamentos em uso',p.medicamentos)}
      ${this.secao('Exame físico',p.exame)}
      ${this.secao('Conduta / plano terapêutico',p.conduta)}
      ${p.prescricoes.length?this.secao('Prescrições',p.prescricoes.map(x=>`${x.n}${x.pos?' — '+x.pos:''}`).join('; ')):''}
      ${p.exames_ped.length?this.secao('Exames solicitados',p.exames_ped.map(x=>`${x.n} (${x.st==='done'?'realizado':'pendente'})`).join('; ')):''}
      <div style="margin-top:26px;border-top:1px solid #ddd;padding-top:12px;font-family:Arial,sans-serif;font-size:10.5px;color:#888">
        Documento gerado pela Suíte Clínica Vitality · Ecossistema Morpheus. Uso clínico. Conforme LGPD e Resolução CFM nº 2.336/2023.</div>
    </div>`;
  },
  secao(t,c){c=(c||'').trim();return `<div style="margin-bottom:14px"><div style="font-family:Arial,sans-serif;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#C8A24A;margin-bottom:4px">${esc(t)}</div>
    <div style="font-family:Arial,sans-serif;font-size:13.5px;line-height:1.6;color:#222">${esc(c)||'—'}</div></div>`;},
  gerarResumo(){
    const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"></head><body>${this.resumoHTML()}</body></html>`;
    const blob=new Blob(['﻿',html],{type:'application/msword'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`resumo-consulta-${ATIVO.nome.toLowerCase().replace(/\s+/g,'-')}.doc`;a.click();URL.revokeObjectURL(a.href);
    toast('Resumo Executivo gerado (.doc — abre no Word).');
  },
  imprimirResumo(){
    const w=window.open('','_blank');if(!w){toast('Permita pop-ups para visualizar.');return;}
    w.document.write(`<html><head><title>Resumo — ${esc(ATIVO.nome)}</title></head><body style="background:#fff;padding:40px">${this.resumoHTML()}</body></html>`);
    w.document.close();setTimeout(()=>w.print(),350);
  },
  item(key){
    if(key==='resumo')return this.gerarResumo();

/* =========================================================
   ESCORES CLÍNICOS (motor determinístico) — FINDRISC, STOP-BANG, FIB-4
   ========================================================= */
const Escores={
  panel(p){
    const iv=imc(p.altura,p.peso); const sexoM=p.sexo==='M';
    return `<div class="card"><h3>Escores clínicos</h3><p class="lead">Calculadoras de risco com os dados do paciente pré-preenchidos. Apoio à decisão — revisão médica obrigatória.</p></div>
    <div class="card"><h3 style="font-size:16px">FINDRISC — risco de diabetes em 10 anos</h3>
      <div class="grid2">
        <div class="fld"><label>Idade</label><select id="fr_idade"><option value="0">< 45</option><option value="2">45–54</option><option value="3">55–64</option><option value="4">> 64</option></select></div>
        <div class="fld"><label>IMC</label><select id="fr_imc"><option value="0" ${iv&&iv<25?'selected':''}>< 25</option><option value="1" ${iv&&iv>=25&&iv<30?'selected':''}>25–30</option><option value="3" ${iv&&iv>=30?'selected':''}>> 30</option></select></div>
        <div class="fld"><label>Circunferência abdominal</label><select id="fr_cint">${sexoM?'<option value="0">H < 94 cm</option><option value="3">H 94–102</option><option value="4">H > 102</option>':'<option value="0">M < 80 cm</option><option value="3">M 80–88</option><option value="4">M > 88</option>'}</select></div>
        <div class="fld"><label>Atividade física ≥ 30 min/dia</label><select id="fr_ativ"><option value="0">Sim</option><option value="2">Não</option></select></div>
        <div class="fld"><label>Come frutas/vegetais todo dia</label><select id="fr_veg"><option value="0">Sim</option><option value="1">Não</option></select></div>
        <div class="fld"><label>Já usou anti-hipertensivo</label><select id="fr_has"><option value="0">Não</option><option value="2">Sim</option></select></div>
        <div class="fld"><label>Já teve glicose alta</label><select id="fr_glic"><option value="0">Não</option><option value="5">Sim</option></select></div>
        <div class="fld"><label>História familiar de diabetes</label><select id="fr_hist"><option value="0">Não</option><option value="3">Avós/tios/primos</option><option value="5">Pais/irmãos/filhos</option></select></div>
      </div>
      <button class="btn btn-gold mini" onclick="Escores.findrisc()">Calcular FINDRISC</button>
      <div id="fr_out" class="score-out"></div></div>
    <div class="card"><h3 style="font-size:16px">STOP-BANG — risco de apneia do sono</h3>
      <div class="chks" id="sb_box">${['Ronco alto','Cansaço/sonolência diurna','Apneia observada','Pressão alta (HAS)','IMC > 35','Idade > 50 anos','Circunferência do pescoço > 40 cm','Sexo masculino'].map((t,i)=>`<span class="chk-pill ${((i===4&&iv&&iv>35)||(i===7&&sexoM))?'on':''}" data-sb="${i}">${t}</span>`).join('')}</div>
      <button class="btn btn-gold mini" style="margin-top:14px" onclick="Escores.stopbang()">Calcular STOP-BANG</button>
      <div id="sb_out" class="score-out"></div></div>
    <div class="card"><h3 style="font-size:16px">FIB-4 — fibrose hepática</h3>
      <div class="grid2">
        <div class="fld"><label>Idade (anos)</label><input id="f4_idade" type="number" value="${idade(p.nasc)||''}"/></div>
        <div class="fld"><label>AST / TGO (U/L)</label><input id="f4_ast" type="number" placeholder="ex.: 32"/></div>
        <div class="fld"><label>ALT / TGP (U/L)</label><input id="f4_alt" type="number" placeholder="ex.: 40"/></div>
        <div class="fld"><label>Plaquetas (×10⁹/L)</label><input id="f4_plaq" type="number" placeholder="ex.: 220"/></div>
      </div>
      <button class="btn btn-gold mini" onclick="Escores.fib4()">Calcular FIB-4</button>
      <div id="f4_out" class="score-out"></div></div>`;
  },
  _out(id,html,cls){const el=document.getElementById(id);el.className='score-out show '+(cls||'');el.innerHTML=html;},
  findrisc(){
    const ids=['fr_idade','fr_imc','fr_cint','fr_ativ','fr_veg','fr_has','fr_glic','fr_hist'];
    const t=ids.reduce((s,id)=>s+ +document.getElementById(id).value,0);
    let r,cls; if(t<7){r='Baixo · ~1% em 10 anos';cls='ok';}else if(t<12){r='Levemente elevado · ~4%';cls='ok';}else if(t<15){r='Moderado · ~17%';cls='warn';}else if(t<21){r='Alto · ~33%';cls='err';}else{r='Muito alto · ~50%';cls='err';}
    this._out('fr_out',`<b>${t} pontos</b> — ${r}`,cls);
  },
  stopbang(){
    const n=document.querySelectorAll('#sb_box .chk-pill.on').length;
    let r,cls; if(n<3){r='Baixo risco';cls='ok';}else if(n<5){r='Risco intermediário';cls='warn';}else{r='Alto risco — considerar polissonografia';cls='err';}
    this._out('sb_out',`<b>${n}/8</b> — ${r}`,cls);
  },
  fib4(){
    const a=+document.getElementById('f4_idade').value,ast=+document.getElementById('f4_ast').value,alt=+document.getElementById('f4_alt').value,plaq=+document.getElementById('f4_plaq').value;
    if(!a||!ast||!alt||!plaq){this._out('f4_out','Preencha idade, AST, ALT e plaquetas.','warn');return;}
    const fib=(a*ast)/(plaq*Math.sqrt(alt));
    let r,cls; if(fib<1.45){r='Baixo — descarta fibrose avançada';cls='ok';}else if(fib<=3.25){r='Indeterminado — investigar (elastografia)';cls='warn';}else{r='Alto — provável fibrose avançada';cls='err';}
    this._out('f4_out',`<b>FIB-4 = ${fib.toFixed(2)}</b> — ${r}`,cls);
  }
};
/* bind das chk-pill do STOP-BANG (toggle) */
document.addEventListener('click',e=>{const el=e.target.closest('#sb_box .chk-pill');if(el)el.classList.toggle('on');});

/* =========================================================
   CENA 3D — pulso clínico sutil (Three.js)
   ========================================================= */
(function scene3d(){
  if(!window.THREE){$('#bg3d').style.display='none';return;}
  const canvas=$('#bg3d');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  const isMobile=matchMedia('(max-width:768px)').matches;
  renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.4:2));
  const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x080B12,0.06);
  const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);cam.position.z=17;
  const GOLD=0xE6CD8C,BLUE=0x2B5AA0;
  const grp=new THREE.Group();
  // esferas concêntricas de partículas (pulso calmo)
  const N=isMobile?900:1700;const pos=new Float32Array(N*3),col=new Float32Array(N*3);
  const cG=new THREE.Color(GOLD),cB=new THREE.Color(0x3E5C8A),cO=new THREE.Color(0xF4F2EA);
  for(let i=0;i<N;i++){const r=6+Math.random()*8,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t);pos[i*3+1]=r*Math.sin(p)*Math.sin(t);pos[i*3+2]=r*Math.cos(p);
    const pk=Math.random();const c=pk<.16?cG:pk<.28?cO:cB;col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(col,3));
  const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:0.055,vertexColors:true,transparent:true,opacity:.72,blending:THREE.AdditiveBlending,depthWrite:false}));
  grp.add(pts);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(4.4,0.02,10,140),new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:.4}));
  ring.rotation.x=1.2;grp.add(ring);
  scene.add(grp);
  let mx=0,my=0,tx=0,ty=0,running=true,clock=0;
  addEventListener('mousemove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5;},{passive:true});
  document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running)loop();});
  addEventListener('resize',resize);function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}resize();
  function loop(){if(!running)return;requestAnimationFrame(loop);clock+=0.01;
    mx+=(tx-mx)*0.03;my+=(ty-my)*0.03;
    grp.rotation.y+=0.0009;grp.rotation.x=my*0.2;
    const s=1+Math.sin(clock)*0.03;grp.scale.setScalar(s); // pulso
    ring.rotation.z+=0.002;
    cam.position.x+=(mx*1.4-cam.position.x)*0.04;cam.position.y+=(-my*1.2-cam.position.y)*0.04;cam.lookAt(0,0,0);
    renderer.render(scene,cam);}
  loop();
})();
